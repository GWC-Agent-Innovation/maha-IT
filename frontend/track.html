<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Track Application | Citizen Certificate Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/app.css">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">
  <div id="site-header"></div>

  <main class="flex-1 max-w-4xl w-full mx-auto px-4 py-8">
    <h1 class="text-2xl font-bold" style="color: var(--navy)">Track Application</h1>
    <p class="text-sm text-slate-500">Enter your application reference number to see the current status.</p>

    <form id="track-form" class="card p-5 mt-5 flex flex-col sm:flex-row gap-3 sm:items-start" novalidate>
      <div data-field class="flex-1">
        <label for="ref" class="sr-only">Application Reference Number</label>
        <input id="ref" class="input uppercase" placeholder="MH-APP-20261030-XXXXXX" data-rules="required">
      </div>
      <button class="btn btn-primary">Track</button>
    </form>

    <div id="my-apps" class="mt-4 text-sm"></div>
    <div id="result" class="mt-6"></div>
  </main>

  <div id="site-footer"></div>

  <script src="js/session.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/api.js"></script>
  <script src="js/validation.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/track.js"></script>
</body>
</html>
