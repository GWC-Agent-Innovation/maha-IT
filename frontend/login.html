<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Citizen Login | Citizen Certificate Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/app.css">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">
  <div id="site-header"></div>

  <main class="flex-1 px-4 py-10">
    <div class="max-w-md mx-auto card p-6 sm:p-8">
      <h1 class="text-2xl font-bold" style="color: var(--navy)">Citizen Login</h1>
      <p class="text-sm text-slate-500 mt-1">Login with your registered mobile number to apply for certificates and view your applications.</p>

      <form id="login-form" class="mt-6 space-y-4" novalidate>
        <div data-field>
          <label for="mobile" class="label">Mobile Number <span class="req">*</span></label>
          <input id="mobile" class="input" inputmode="numeric" maxlength="10" placeholder="10-digit mobile number" data-rules="required mobile" autocomplete="tel">
        </div>
        <div data-field>
          <label for="password" class="label">Password <span class="req">*</span></label>
          <input id="password" type="password" class="input" placeholder="Minimum 6 characters" data-rules="required password" autocomplete="current-password">
        </div>
        <button class="btn btn-primary w-full" id="login-btn">Login</button>
      </form>

      <p class="text-sm text-center mt-6">New user? <a id="register-link" href="register.html" class="font-semibold underline" style="color: var(--navy)">Register here</a></p>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="js/session.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/api.js"></script>
  <script src="js/validation.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
