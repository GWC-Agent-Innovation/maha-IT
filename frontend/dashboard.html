<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Account | Citizen Certificate Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/app.css">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">
  <div id="site-header"></div>

  <main class="flex-1 max-w-6xl w-full mx-auto px-4 py-8">
    <div class="flex flex-col sm:flex-row sm:items-end justify-between gap-4">
      <div>
        <h1 class="text-2xl font-bold" style="color: var(--navy)">My Account</h1>
        <p class="text-sm text-slate-500" id="account-line"></p>
      </div>
      <a href="index.html#services" class="btn btn-accent self-start">Apply for a Certificate</a>
    </div>

    <!-- Summary tiles -->
    <section class="grid gap-4 grid-cols-2 lg:grid-cols-4 mt-6" id="summary">
      <div class="card p-4"><div class="text-xs text-slate-500 uppercase tracking-wide">Applications</div><div class="text-2xl font-bold mt-1" id="sum-apps">–</div></div>
      <div class="card p-4"><div class="text-xs text-slate-500 uppercase tracking-wide">Certificates Issued</div><div class="text-2xl font-bold mt-1 text-green-700" id="sum-certs">–</div></div>
      <div class="card p-4"><div class="text-xs text-slate-500 uppercase tracking-wide">In Progress</div><div class="text-2xl font-bold mt-1 text-amber-700" id="sum-progress">–</div></div>
      <div class="card p-4"><div class="text-xs text-slate-500 uppercase tracking-wide">Total Paid</div><div class="text-2xl font-bold mt-1" id="sum-paid">–</div></div>
    </section>

    <!-- Tabs -->
    <div class="mt-8 border-b border-slate-200 flex gap-1" role="tablist">
      <button type="button" class="tab px-4 py-2 text-sm font-semibold border-b-2 -mb-px" role="tab" data-tab="applications">My Applications</button>
      <button type="button" class="tab px-4 py-2 text-sm font-semibold border-b-2 -mb-px" role="tab" data-tab="certificates">My Certificates</button>
      <button type="button" class="tab px-4 py-2 text-sm font-semibold border-b-2 -mb-px" role="tab" data-tab="payments">Payment History</button>
    </div>

    <section id="tab-applications" class="tab-panel mt-4"></section>
    <section id="tab-certificates" class="tab-panel mt-4 hidden"></section>
    <section id="tab-payments" class="tab-panel mt-4 hidden"></section>
  </main>

  <div id="site-footer"></div>

  <script src="js/session.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/api.js"></script>
  <script src="js/validation.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
